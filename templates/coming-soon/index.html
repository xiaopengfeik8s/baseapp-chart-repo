<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Invite Code - ossupload</title>
        <link rel="icon" type="image/x-icon" href="/ossupload/static/assets/favicon.ico" />
        <!-- Font Awesome icons -->
        <link href="/ossupload/static/fontawesome/css/all.min.css" rel="stylesheet" />
        <!-- Google fonts-->
        <link href="/ossupload/static/fonts/tinos.css" rel="stylesheet" />
        <link href="/ossupload/static/fonts/dm-sans.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="/ossupload/static/css/styles.css" rel="stylesheet" />
        <style>
            .masthead:before {
                background-color: transparent !important;
            }
        </style>
    </head>
    <body>
        <!-- Background Video-->
        <video class="bg-video" playsinline="playsinline" autoplay="autoplay" muted="muted" loop="loop"><source src="/ossupload/static/assets/mp4/bg.mp4" type="video/mp4" /></video>
        <!-- Masthead-->
        <div class="masthead">
            <div class="masthead-content text-white">
                <div class="container-fluid px-4 px-lg-0">
                    <h1 class="fst-italic lh-1 mb-4">Enter Invite Code</h1>
                    <p class="mb-5">Please enter your unique invite code to access the platform.</p>
                    <form id="contactForm" action="/ossupload/verify" method="POST">
                        <!-- Email address input-->
                        <div class="row input-group-newsletter">
                            <div class="col"><input class="form-control is-invalid" id="inviteCode" name="invite_code" type="text" placeholder="Enter invite code..." aria-label="Enter invite code..." data-sb-validations="required" data-sb-can-submit="no" required /></div>
                            <div class="col-auto"><button class="btn btn-primary " id="submitButton" type="submit">Submit</button></div>

                        </div>
                        <div class="invalid-feedback mt-2" data-sb-feedback="inviteCode:required">An invite code is required.</div>
                        <!-- Submit success message-->
                        <!---->
                        <!-- This is what your users will see when the form-->
                        <!-- has successfully submitted-->
                        <div class="{% if show_error %}d-block{% else %}d-none{% endif %}" id="submitSuccessMessage">
                            <div class="row input-group-newsletter">
                                <a href="https://thoughts.aliyun.com/workspaces/623a8f782f9c95001af6f486/docs/6791de39c71a890001cd9ddd" class="btn btn-success mt-2" target="_blank">获取邀请码</a>
                                <div class="text-center text-danger mb-3 mt-2">Invite code verified!</div>
                            </div>
                        </div>
                        <!-- Submit error message-->
                        <!---->
                        <!-- This is what your users will see when there is-->
                        <!-- an error submitting the form-->
                        <div class="d-none" id="submitErrorMessage"><div class="text-center text-danger mb-3 mt-2">Error sending message!</div></div>
                    </form>
                </div>
            </div>
        </div>
        <!-- Social Icons-->
        <!-- For more icon options, visit https://fontawesome.com/icons?d=gallery&p=2&s=brands-->
        <div class="social-icons">
            <div class="d-flex flex-row flex-lg-column justify-content-center align-items-center h-100 mt-3 mt-lg-0">
                <a class="btn btn-dark m-3" href="#!"><i class="fab fa-twitter"></i></a>
                <a class="btn btn-dark m-3" href="#!"><i class="fab fa-facebook-f"></i></a>
                <a class="btn btn-dark m-3" href="#!"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
        <!-- Bootstrap core JS-->
        <script src="/ossupload/static/bootstrap5/js/bootstrap.bundle.min.js"></script>
        <!-- Core theme JS-->
        <script src="/ossupload/static/js/scripts.js"></script>
    </body>
</html>
