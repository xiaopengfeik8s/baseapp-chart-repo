<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invitation Code</title>
    <link href="/ossupload/static/bootstrap5/css/bootstrap.min.css" rel="stylesheet">
    <script src="/ossupload/static/jquery-3.6.0/js/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h1 class="mb-4 text-center">请输入邀请码</h1>
                        <form id="loginForm" action="{{ url_for('verify_code') }}" method="post">
                            <div class="mb-3">
                                <input class="form-control form-control-lg" type="text" name="invite_code" required>
                            </div>
                            {% with messages = get_flashed_messages() %}
                            {% if messages %}
                                {% for message in messages %}
                                <div class="alert alert-danger mb-3">
                                    {{ message }}
                                </div>
                                {% endfor %}
                            {% endif %}
                            {% endwith %}
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">验证</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- 确保没有包含不安全的 iframe -->
</body>
</html>
